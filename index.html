<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixation</title>
<style>
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#fixation {
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: gray;
    color: white;
    border-radius: 18px;
    font-family: Arial, sans-serif;
    font-size: 150px;
    line-height: 1;
    user-select: none;
    -webkit-user-select: none;
}
</style>
</head>
<body>
<div id="fixation">✖</div>

<script>
'use strict';

let wakeLock = null;
let wakeLockEnabled = true;

/*
ページ表示時に画面起動ロックを取得します。
会社のグループポリシーや端末の強制ロックが優先される場合は、
この処理を追加しても画面消灯を防げないことがあります。
*/
async function requestScreenWakeLock() {
    if (!("wakeLock" in navigator)) {
        console.warn(
            "このブラウザーはScreen Wake Lock APIに対応していません。"
        );
        return false;
    }

    try {
        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
            console.warn("画面起動ロックが解除されました。");
            wakeLock = null;
        });

        console.log("画面起動ロックを取得しました。");
        return true;

    } catch (error) {
        console.warn(
            "画面起動ロックを取得できませんでした。",
            error
        );
        wakeLock = null;
        return false;
    }
}

/* ページ表示と同時にWake Lockを要求します。 */
window.addEventListener("load", () => {
    void requestScreenWakeLock();
});

/*
タブ切り替えや最小化によってWake Lockが解除された場合、
同じページへ戻ったときに自動で再取得します。
*/
document.addEventListener("visibilitychange", () => {
    if (
        document.visibilityState === "visible" &&
        wakeLockEnabled &&
        wakeLock === null
    ) {
        void requestScreenWakeLock();
    }
});

/* ページを閉じるときはWake Lockを解除します。 */
window.addEventListener("pagehide", () => {
    wakeLockEnabled = false;

    if (wakeLock !== null) {
        void wakeLock.release();
        wakeLock = null;
    }
});
</script>
</body>
</html>
